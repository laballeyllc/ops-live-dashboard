<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Alley — Live Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B1F23;
    --panel: #22272C;
    --panel-raised: #282E34;
    --border: #2E343A;
    --text: #E8E6E1;
    --text-muted: #9AA0A6;
    --warehouse: #4FB0A5;
    --warehouse-dim: #2E4A47;
    --freight: #D9A441;
    --freight-dim: #4A3F26;
    --alert: #C1594A;
    --both: #8B7FC7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header h1 span {
    color: var(--text-muted);
    font-weight: 400;
  }

  #last-updated {
    font-size: 13px;
    color: var(--text-muted);
  }

  #last-updated .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--warehouse);
    margin-right: 7px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  main {
    padding: 28px 32px 48px;
    max-width: 1400px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .summary-card {
    background: var(--panel);
    padding: 18px 20px;
  }

  .summary-card .value {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.1;
  }

  .summary-card .label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .summary-card.warehouse .value { color: var(--warehouse); }
  .summary-card.freight .value { color: var(--freight); }
  .summary-card.both .value { color: var(--both); }
  .summary-card.alert .value { color: var(--alert); }

  .breakdowns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }

  .breakdown-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
  }

  .breakdown-panel h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 12px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .bar-row .bar-label {
    width: 130px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .bar-row .bar-track {
    flex: 1;
    height: 8px;
    background: var(--panel-raised);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-row .bar-fill {
    height: 100%;
    background: var(--warehouse);
    border-radius: 4px;
  }

  .bar-row .bar-count {
    width: 34px;
    text-align: right;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
  }

  thead th {
    text-align: left;
    padding: 10px 14px;
    background: var(--panel-raised);
    color: var(--text-muted);
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  thead th:hover { color: var(--text); }

  thead th.sorted::after {
    content: ' ▾';
    color: var(--warehouse);
  }

  thead th.sorted.asc::after {
    content: ' ▴';
  }

  tbody td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-raised); }

  td.description {
    white-space: normal;
    max-width: 320px;
  }

  .tag-pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
  }

  .tag-pill.warehouse { background: var(--warehouse-dim); color: var(--warehouse); }
  .tag-pill.freight { background: var(--freight-dim); color: var(--freight); }
  .tag-pill.both { background: #35306B; color: var(--both); }
  .tag-pill.other { background: var(--panel-raised); color: var(--text-muted); }

  #empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>Lab Alley <span>· Live Queue</span></h1>
  <div id="last-updated"><span class="dot"></span><span id="last-updated-text">Loading…</span></div>
</header>

<main>
  <div class="summary-row" id="summary-row"></div>

  <div class="breakdowns">
    <div class="breakdown-panel">
      <h2>Category</h2>
      <div id="category-breakdown"></div>
    </div>
    <div class="breakdown-panel">
      <h2>CHEM TECH</h2>
      <div id="chemtech-breakdown"></div>
    </div>
    <div class="breakdown-panel">
      <h2>LAB ROOM required</h2>
      <div id="labroom-breakdown"></div>
    </div>
  </div>

  <table id="queue-table">
    <thead>
      <tr>
        <th data-key="Order ID">Order ID</th>
        <th data-key="Order date">Order date</th>
        <th data-key="Product ID">Product ID</th>
        <th data-key="Description">Description</th>
        <th data-key="Category">Category</th>
        <th data-key="CHEM TECH">CHEM TECH</th>
        <th data-key="LAB ROOM">LAB ROOM</th>
        <th data-key="Core Queue">Queue</th>
      </tr>
    </thead>
    <tbody id="queue-tbody"></tbody>
  </table>
  <div id="empty-state" style="display:none;">No live_queue.csv data found yet — check that pull_live_queue.py has run at least once.</div>
</main>

<script>
let currentRows = [];
let sortKey = "Order date";
let sortAsc = true;

function tagPillClass(coreQueue) {
  if (coreQueue === "Warehouse") return "warehouse";
  if (coreQueue === "Freight") return "freight";
  if (coreQueue === "Both") return "both";
  return "other";
}

function renderSummary(summary) {
  const cq = summary.core_queue_counts || {};
  const cards = [
    { label: "In queue", value: summary.total_orders, cls: "" },
    { label: "Warehouse", value: cq["Warehouse"] || 0, cls: "warehouse" },
    { label: "Freight", value: cq["Freight"] || 0, cls: "freight" },
    { label: "Split (both)", value: cq["Both"] || 0, cls: "both" },
    {
      label: summary.oldest_order_id ? `Oldest — #${summary.oldest_order_id}` : "Oldest order",
      value: summary.oldest_age_days + "d",
      cls: summary.oldest_age_days > 14 ? "alert" : ""
    },
  ];
  document.getElementById("summary-row").innerHTML = cards.map(c => `
    <div class="summary-card ${c.cls}">
      <div class="value">${c.value}</div>
      <div class="label">${c.label}</div>
    </div>
  `).join("");
}

function renderBreakdown(elId, counts) {
  const total = counts.reduce((sum, [, n]) => sum + n, 0) || 1;
  const top = counts.slice(0, 6);
  document.getElementById(elId).innerHTML = top.map(([label, n]) => `
    <div class="bar-row">
      <div class="bar-label" title="${label}">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(n/total*100).toFixed(0)}%"></div></div>
      <div class="bar-count">${n}</div>
    </div>
  `).join("");
}

function renderTable() {
  const rows = [...currentRows].sort((a, b) => {
    const av = a[sortKey] || "";
    const bv = b[sortKey] || "";
    const cmp = av.localeCompare(bv, undefined, { numeric: true });
    return sortAsc ? cmp : -cmp;
  });

  document.getElementById("queue-tbody").innerHTML = rows.map(r => `
    <tr>
      <td>${r["Order ID"] || ""}</td>
      <td>${r["Order date"] || ""}</td>
      <td>${r["Product ID"] || ""}</td>
      <td class="description">${r["Description"] || ""}</td>
      <td>${r["Category"] || ""}</td>
      <td>${r["CHEM TECH"] || ""}</td>
      <td>${r["LAB ROOM"] || ""}</td>
      <td><span class="tag-pill ${tagPillClass(r["Core Queue"])}">${r["Core Queue"] || "Other"}</span></td>
    </tr>
  `).join("");

  document.querySelectorAll("thead th").forEach(th => {
    th.classList.toggle("sorted", th.dataset.key === sortKey);
    th.classList.toggle("asc", th.dataset.key === sortKey && sortAsc);
  });
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    if (sortKey === th.dataset.key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = th.dataset.key;
      sortAsc = true;
    }
    renderTable();
  });
});

async function refresh() {
  try {
    const res = await fetch("/api/queue");
    const data = await res.json();
    currentRows = data.rows || [];

    document.getElementById("last-updated-text").textContent =
      data.last_updated ? `Updated ${data.last_updated}` : "No data yet";
    document.getElementById("empty-state").style.display = currentRows.length ? "none" : "block";
    document.getElementById("queue-table").style.display = currentRows.length ? "table" : "none";

    renderSummary(data.summary);
    renderBreakdown("category-breakdown", data.summary.category_counts || []);
    renderBreakdown("chemtech-breakdown", data.summary.chem_tech_counts || []);
    renderBreakdown("labroom-breakdown", data.summary.lab_room_counts || []);
    renderTable();
  } catch (err) {
    document.getElementById("last-updated-text").textContent = "Connection error";
  }
}

refresh();
setInterval(refresh, 30000);
</script>

</body>
</html>
