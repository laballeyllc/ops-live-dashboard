name: Historical Banking Pull

# Triggered externally (an outside cron service calling GitHub's API to
# fire workflow_dispatch) rather than GitHub's own native `schedule:`
# trigger — same reasoning as live_queue.yml: the native scheduler is
# currently unreliable platform-wide, drifting hours off its intended
# times, while manual/API-triggered runs fire correctly every time.
#
# CONFIRMED, FIXED (2026-10-03): this file still had BOTH the native
# schedule: block AND workflow_dispatch active at the same time — the
# schedule: block was apparently never removed when the external
# trigger was added. Result: this workflow was firing twice as often as
# intended, every single day since at least 2026-09-16, once cleanly
# from the external trigger and once more, unpredictably drifted, from
# GitHub's own flaky scheduler — exactly the extra, irregularly-timed
# rows found in the snapshots table. schedule: is removed below; only
# the external trigger remains, matching every other workflow in this
# project.
#
# The actual 5pm/7am timing now lives entirely in the EXTERNAL
# scheduler's configuration (cron-job.org or similar). The same DST
# caveat as before still applies there: Central Daylight Time (Mar-Nov)
# is UTC-5, Standard Time (Nov-Mar) is UTC-6 — adjust the external
# scheduler's cron times by an hour each season if you want exact local
# time, same trade-off as before (an hour of drift twice a year on a
# banking job is a minor, accepted trade-off, not automated away).
on:
  workflow_dispatch: {}

concurrency:
  group: historical-banking-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pull_ops_data.py
        env:
          FINALE_API_KEY: ${{ secrets.FINALE_API_KEY }}
          FINALE_API_SECRET: ${{ secrets.FINALE_API_SECRET }}
          SHIPSTATION_API_KEY: ${{ secrets.SHIPSTATION_API_KEY }}
          SHIPSTATION_API_SECRET: ${{ secrets.SHIPSTATION_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pull_ops_data.py
