<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier pricing</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Same palette as Ops Live and the KPI page so the pages read as one tool. */
  :root {
    --bg: #1B1F23;
    --panel: #22272C;
    --panel-raised: #282E34;
    --border: #2E343A;
    --border-strong: #3A424A;
    --text: #E8E6E1;
    --text-muted: #9AA0A6;
    --better: #4FB0A5;
    --worse: #C1594A;
    --worse-text: #E39A8D;
    --freight: #D9A441;
    --radius-s: 4px;
    --radius-m: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums;
  }
  a { color: var(--text-muted); }
  a:hover { color: var(--text); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--freight); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  header.top h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header.top nav { display: flex; gap: 16px; align-items: baseline; color: var(--text-muted); font-size: 13px; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-m); }
  .lbl { font-size: 13px; color: var(--text-muted); }
  .hidden { display: none !important; }

  /* ---- messages ---- */
  #status { margin-bottom: 12px; }
  .msg { border: 1px solid var(--border-strong); border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .msg.err { border-color: var(--worse); color: var(--worse-text); }
  .msg.info { color: var(--text-muted); }

  /* ---- controls ---- */
  .controls { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field-wrap { display: flex; flex-direction: column; gap: 4px; position: relative; min-width: 0; }
  .field {
    width: 100%; min-height: 44px; background: var(--panel-raised); border: 1px solid var(--border);
    border-radius: var(--radius-s); padding: 0 12px; color-scheme: dark; text-align: left;
  }
  button.field { display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: pointer; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { min-height: 44px; background: none; border: 1px solid transparent; border-radius: var(--radius-s); padding: 0 14px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
  .btn { min-height: 44px; border: 0; border-radius: var(--radius-s); padding: 0 18px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; background: var(--text); color: var(--bg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.quiet { background: var(--panel-raised); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .split { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 16px; }
  .pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; width: 300px; max-width: 90vw; background: var(--panel-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-m); padding: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); max-height: 60vh; overflow: auto; }
  .pop label { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px; cursor: pointer; }
  .pop input[type=checkbox], td input[type=checkbox], th input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--better); }
  .pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
  #sku-pop { width: 400px; }
  #sku-opts label { align-items: flex-start; padding: 8px; }
  #sku-opts .opt { display: flex; flex-direction: column; min-width: 0; }
  #sku-opts .desc { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }
  .pop-actions { display: flex; gap: 8px; margin: 8px 0 4px; flex-wrap: wrap; }
  .pop-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; }
  #skubtn-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 4px 0 12px; background: var(--panel-raised); border: 1px solid var(--border-strong); border-radius: 999px; font-size: 13px; }
  .chip.off { opacity: .55; }
  .chip button { min-width: 36px; min-height: 36px; background: none; border: 0; border-radius: 999px; cursor: pointer; font-size: 18px; line-height: 1; color: var(--text-muted); }
  .chip button:hover { color: var(--text); }

  /* ---- summary cards ---- */
  section.block { margin-top: 16px; }
  .sum { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sum-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .sum-head h2, .chart-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat { background: var(--panel-raised); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; }
  .stat .k { font-size: 12px; color: var(--text-muted); }
  .stat .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .stat .s { font-size: 12px; color: var(--text-muted); margin-top: 2px; overflow-wrap: anywhere; }

  /* ---- tables ---- */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { font-weight: 500; font-size: 12px; color: var(--text-muted); text-align: left; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th button { background: none; border: 0; padding: 4px 0; cursor: pointer; font-weight: 500; font-size: 12px; color: var(--text-muted); display: inline-flex; gap: 4px; align-items: center; }
  th button:hover { color: var(--text); }
  th[aria-sort] button { color: var(--text); }
  td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th.n, td.n { text-align: right; }
  tr.sel td { background: var(--panel-raised); }
  .sku { font-weight: 600; overflow-wrap: anywhere; }
  .desc { font-size: 12px; color: var(--text-muted); max-width: 340px; overflow-wrap: anywhere; }
  .amber { color: var(--freight); }
  .red { color: var(--worse-text); }
  .tag { font-size: 12px; }
  .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 10px 4px; align-items: center; }
  .mk { display: inline-flex; align-items: center; gap: 8px; }

  /* ---- chart ---- */
  .chart-panel { padding: 16px; }
  .chart-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; margin-bottom: 12px; }
  .chart-box svg { width: 100%; height: auto; display: block; }
  .chart-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Supplier pricing</h1>
    <nav>
      <span id="data-note"></span>
      <a href="/">Ops Live</a>
      <a href="/kpi.html">KPI Summary</a>
    </nav>
  </header>

  <div id="status" role="status" aria-live="polite"></div>

  <section class="panel controls" aria-label="Filters" id="controls">
    <div class="row">
      <div class="field-wrap" style="flex: 2 1 260px">
        <label class="lbl" for="q">Search</label>
        <input id="q" class="field" type="search" placeholder="SKU, description or supplier" autocomplete="off">
      </div>
      <div class="field-wrap" style="flex: 1 1 180px">
        <label class="lbl" for="sup" id="sup-lbl">Supplier</label>
        <select id="sup" class="field"><option value="">All suppliers</option></select>
      </div>
      <div class="field-wrap" style="flex: 1 1 200px" id="sku-wrap">
        <span class="lbl" id="sku-lbl">SKU</span>
        <button type="button" id="skubtn" class="field" aria-haspopup="true" aria-expanded="false" aria-labelledby="sku-lbl skubtn"><span id="skubtn-text">All SKUs</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg></button>
        <div class="pop hidden" id="sku-pop" role="group" aria-label="SKUs">
          <input id="sku-q" class="field" type="search" placeholder="Type to find SKUs" aria-label="Find SKUs" autocomplete="off">
          <div class="pop-actions"><button type="button" class="btn quiet" id="sku-all">Select all</button><button type="button" class="btn quiet" id="sku-clear">Clear</button></div>
          <div id="sku-opts"></div>
          <div class="pop-foot"><span class="lbl" id="sku-more"></span><button type="button" class="btn" id="sku-done">Done</button></div>
        </div>
      </div>
      <div class="field-wrap" style="flex: 1 1 210px" id="dest-wrap">
        <span class="lbl" id="dest-lbl">Destination</span>
        <button type="button" id="dest" class="field" aria-haspopup="true" aria-expanded="false" aria-labelledby="dest-lbl dest"><span id="dest-text">All destinations</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg></button>
        <div class="pop hidden" id="dest-pop" role="group" aria-label="Destinations"></div>
      </div>
    </div>
    <div id="chips" class="chips" aria-label="Chosen SKUs"></div>
    <div id="note" class="lbl" role="status" aria-live="polite"></div>
    <div class="row">
      <div class="field-wrap">
        <span class="lbl" id="range-lbl">Date range (order date)</span>
        <div class="seg" id="presets" role="group" aria-labelledby="range-lbl">
          <button type="button" data-p="90d">90 days</button>
          <button type="button" data-p="6m">6 months</button>
          <button type="button" data-p="12m">12 months</button>
          <button type="button" data-p="24m">24 months</button>
          <button type="button" data-p="all">All time</button>
          <button type="button" data-p="custom">Custom</button>
        </div>
      </div>
      <div class="field-wrap"><label class="lbl" for="from">From</label><input id="from" class="field" type="date" style="width: 160px"></div>
      <div class="field-wrap"><label class="lbl" for="to">To</label><input id="to" class="field" type="date" style="width: 160px"></div>
    </div>
    <div class="split">
      <div class="field-wrap">
        <span class="lbl" id="view-lbl">Price view</span>
        <div class="seg" id="views" role="group" aria-labelledby="view-lbl">
          <button type="button" data-v="same">Same supplier over time</button>
          <button type="button" data-v="all">All suppliers for the SKU</button>
        </div>
      </div>
      <div class="row" style="align-items: center">
        <span class="lbl" id="gen-hint"></span>
        <button type="button" class="btn" id="gen">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 14 6.5 8.5 10 11.5 16 4"/><path d="M2 16h14"/></svg>
          <span id="gen-text">Generate chart</span></button>
      </div>
    </div>
  </section>

  <section class="block" id="summary" aria-label="Selection summary"></section>
  <section class="block" id="chart" aria-label="Price chart"></section>

  <section class="panel block" id="table-panel" aria-label="SKUs and suppliers" style="padding: 4px 8px 12px">
    <div class="tbl-wrap"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="foot"><span class="lbl" id="count"></span><span class="row" style="gap: 8px; align-items: center"><button type="button" class="btn quiet" id="more">Show more</button><button type="button" class="btn quiet" id="clear-sel">Clear ticks</button></span></div>
  </section>
</div>

<script>
// The anon key is the public, read-only key; netlify-build.sh injects it
// at deploy time, same as site/index.html and site/kpi.html.
const SUPABASE_URL = "https://pdflsmequzgpeuodnxyg.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";

// Cutoffs for the Watch and High flags, as variation (std dev / average price) in percent.
const WATCH_PCT = 10, HIGH_PCT = 15;
const MAX_LINES = 8;        // more selected rows than this and Generate chart draws the volatility ranking
const RANK_ROWS = 25;       // the ranking shows the most volatile rows up to this many
const PAGE = 100;           // table rows shown at a time

// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const NONE = "(no destination)";

const money = (v) => v == null || isNaN(v) ? "\u2013" : "$" + v.toLocaleString("en-US", { minimumFractionDigits: Math.abs(v) < 0.2 ? 3 : 2, maximumFractionDigits: Math.abs(v) < 0.2 ? 3 : 2 });
const moneySd = (v) => { if (v == null || isNaN(v)) return "\u2013"; const d = Math.abs(v) < 0.2 ? 4 : Math.abs(v) < 1 ? 3 : 2; return "$" + v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); };
const pct = (v) => v == null || isNaN(v) ? "\u2013" : v.toFixed(1) + "%";
const signPct = (v) => v == null || isNaN(v) ? "\u2013" : (v >= 0 ? "+" : "\u2212") + Math.abs(v).toFixed(1) + "%";
const parts = (iso) => iso.split("-").map(Number);
const fmtDate = (iso) => { const [y, m, d] = parts(iso); return MONTHS[m - 1] + " " + d + ", " + y; };
const utc = (iso) => { const [y, m, d] = parts(iso); return Date.UTC(y, m - 1, d); };
const isoOf = (ms) => new Date(ms).toISOString().slice(0, 10);
const addDays = (iso, n) => isoOf(utc(iso) + n * 86400000);
function addMonths(iso, n) { const [y, m, d] = parts(iso); const dt = new Date(Date.UTC(y, m - 1 + n, 1)); const last = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate(); dt.setUTCDate(Math.min(d, last)); return dt.toISOString().slice(0, 10); }
function todayIso() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
const sortStr = (a, b) => String(a).localeCompare(String(b), "en", { numeric: true, sensitivity: "base" });
const median = (a) => { const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };

function statsOf(rowsByDate) {
  const p = rowsByDate.map((r) => r.unit_price), n = p.length;
  const mean = p.reduce((a, b) => a + b, 0) / n;
  const sd = n > 1 ? Math.sqrt(p.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (n - 1)) : null;   // sample std dev
  const first = p[0], latest = p[n - 1];
  return { n, mean, sd, cv: sd == null ? null : sd / mean * 100, lo: Math.min(...p), hi: Math.max(...p), first, latest, change: n > 1 ? (latest / first - 1) * 100 : null, lastDate: rowsByDate[n - 1].order_date };
}
const byDate = (a, b) => a.order_date < b.order_date ? -1 : a.order_date > b.order_date ? 1 : (a.line_key < b.line_key ? -1 : 1);
const flag = (cv) => cv == null ? "" : cv >= HIGH_PCT ? '<span class="tag red">High</span>' : cv >= WATCH_PCT ? '<span class="tag amber">Watch</span>' : "";
const cvCell = (cv) => cv == null ? "\u2013" : (cv >= HIGH_PCT ? '<span class="red">' + pct(cv) + "</span> " : cv >= WATCH_PCT ? '<span class="amber">' + pct(cv) + "</span> " : pct(cv) + " ") + flag(cv);

// ---------------------------------------------------------------- state
const db = (typeof supabase !== "undefined") ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const S = {
  rows: [], loaded: false,
  q: "", supplier: "", skus: new Set(), skuQuery: "", dests: new Set(), allDests: [],
  preset: "12m", from: "", to: "",
  view: "same", chartOn: false, sort: { key: "sku", dir: 1 }, shown: PAGE,
  selected: new Set(),
};
let V = null;       // the current derived view (groups, visible rows, selection...)

// ---------------------------------------------------------------- loading
async function fetchAll() {
  const out = []; let start = 0;
  for (;;) {
    const { data, error } = await db.from("supplier_prices").select("*").order("line_key").range(start, start + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
    start += 1000;
  }
  return out;
}

async function load() {
  $("status").innerHTML = '<div class="msg info">Loading prices\u2026</div>';
  try {
    if (!db) throw new Error("The Supabase library did not load. Check the connection and reload.");
    const raw = await fetchAll();
    S.rows = raw.map((r) => ({ ...r, unit_price: Number(r.unit_price), quantity: r.quantity == null ? null : Number(r.quantity), quantity_received: r.quantity_received == null ? null : Number(r.quantity_received), destination: r.destination || NONE }))
                .filter((r) => isFinite(r.unit_price) && r.unit_price > 0 && r.order_date);
    S.loaded = true;
    S.allDests = [...new Set(S.rows.map((r) => r.destination))].sort(sortStr);
    S.dests = new Set(S.allDests);
    fillLists();
    const newest = S.rows.reduce((m, r) => r.updated_at && r.updated_at > m ? r.updated_at : m, "");
    $("data-note").textContent = newest ? "Prices as of " + new Date(newest).toLocaleString("en-US", { timeZone: "America/Chicago", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " CT" : "";
    $("status").innerHTML = S.rows.length ? "" : '<div class="msg info">No purchase lines yet. The daily pull from Finale fills this page; once it has run, reload.</div>';
    applyPreset(S.preset);
    update();
  } catch (e) {
    $("status").innerHTML = '<div class="msg err"><span>Couldn\u2019t load supplier prices: ' + esc(e.message || e) + '</span><button type="button" class="btn quiet" id="retry">Try again</button></div>';
    $("retry").onclick = load;
  }
}

// ---------------------------------------------------------------- dependent filters
// Search, Supplier, SKU and Destination narrow each other. "Ever" means everything loaded, whatever the date range,
// so the choices don't shift as you move the dates. The SKU picker is a multi-select: S.skus is the chosen set.
// A "pair" is one SKU bought from one supplier; Search matches a pair on its SKU, description and supplier name together.
let IDX = null, SEARCH_TERMS = [], supKey = null, skuKey = null, destKey = null, SKU_VIEW = [], CHIP_VIEW = [];
const SKU_LIST_MAX = 200, CHIPS_MAX = 12;
function buildIndexes() {
  IDX = { skuSups: new Map(), supSkus: new Map(), skuDesc: new Map(), hay: new Map() };
  const pairMap = new Map(), descDate = new Map();
  for (const r of S.rows) {
    if (!IDX.skuSups.has(r.product_id)) IDX.skuSups.set(r.product_id, new Set());
    IDX.skuSups.get(r.product_id).add(r.supplier);
    if (!IDX.supSkus.has(r.supplier)) IDX.supSkus.set(r.supplier, new Set());
    IDX.supSkus.get(r.supplier).add(r.product_id);
    const k = r.product_id + "\u0001" + r.supplier;
    if (!pairMap.has(k)) pairMap.set(k, { key: k, sku: r.product_id, sup: r.supplier, dests: new Set() });
    pairMap.get(k).dests.add(r.destination);
    if (r.description && (!descDate.has(r.product_id) || r.order_date >= descDate.get(r.product_id))) { descDate.set(r.product_id, r.order_date); IDX.skuDesc.set(r.product_id, r.description); }
  }
  IDX.pairs = [...pairMap.values()];
  for (const p of IDX.pairs) { p.hay = (p.sku + " " + (IDX.skuDesc.get(p.sku) || "") + " " + p.sup).toLowerCase(); IDX.hay.set(p.key, p.hay); }
  IDX.allSkus = [...IDX.skuSups.keys()].sort(sortStr);
  IDX.allSups = [...IDX.supSkus.keys()].sort(sortStr);
}
const hit = (hay) => SEARCH_TERMS.every((t) => hay.includes(t));
const supplierSkus = (sup) => IDX.supSkus.get(sup) || new Set();
const skuText = () => S.skus.size === 0 ? "All SKUs" : S.skus.size === 1 ? [...S.skus][0] : S.skus.size + " SKUs chosen";

// the SKUs the picker can offer: the chosen supplier's (or everyone's) that also match the Search; chosen ones are added on top so they can be unticked
function skuPool() {
  const pool = new Set(S.supplier ? supplierSkus(S.supplier) : IDX.allSkus);
  if (SEARCH_TERMS.length) {
    const ok = new Set();
    for (const p of IDX.pairs) if ((!S.supplier || p.sup === S.supplier) && hit(p.hay)) ok.add(p.sku);
    for (const x of [...pool]) if (!ok.has(x)) pool.delete(x);
  }
  return pool;
}
function skuMatches() {
  const pool = skuPool();
  S.skus.forEach((x) => pool.add(x));
  const q = S.skuQuery.trim().toLowerCase();
  return [...pool].filter((x) => !q || x.toLowerCase().includes(q) || (IDX.skuDesc.get(x) || "").toLowerCase().includes(q)).sort(sortStr);
}
function renderSkuOpts() {
  const all = skuMatches(), shown = all.slice(0, SKU_LIST_MAX), have = S.supplier ? supplierSkus(S.supplier) : null;

// ---------------------------------------------------------------- derive
function derive() {

  const base = S.rows.filter(inRange);

  for (const r of base) {
    const k = r.product_id + "\u0001" + r.supplier;
    if (!groups.has(k)) groups.set(k, { key: k, sku: r.product_id, supplier: r.supplier, rows: [] });
    groups.get(k).rows.push(r);

  for (const g of groups.values()) {

  const skuSet = S.skus.size ? S.skus : null;
  const visible = [...groups.values()].filter((g) => {
    if (S.supplier && g.supplier !== S.supplier) return false;
    if (skuSet && !skuSet.has(g.sku)) return false;
    if (SEARCH_TERMS.length && !hit(IDX.hay.get(g.key) || "")) return false;
    return true;
  });
  const { key, dir } = S.sort;
  const val = (g) => ({ sku: g.sku, supplier: g.supplier, n: g.st.n, latest: g.st.latest, mean: g.st.mean, hi: g.st.hi, sd: g.st.sd, cv: g.st.cv, change: g.st.change })[key];
  visible.sort((a, b) => {

    return c ? c * dir : sortStr(a.sku, b.sku);

  let focusSku = null;

  const tickedSkus = new Set(selGroups.map((g) => g.sku));

  else if (S.skus.size === 1 && skuNames.has([...S.skus][0].toLowerCase())) focusSku = skuNames.get([...S.skus][0].toLowerCase());

  V = { base, groups, visible, selGroups, focusSku, focusGroups };

      '<div class="cards">' + stat("Standard deviation", moneySd(p.sd), "all suppliers pooled") + stat("Variation", pct(p.cv), "std dev \u00f7 average price") + stat("Average price", money(p.mean), "per unit, all suppliers") + stat("Low \u2013 high", money(p.lo) + " \u2013 " + money(p.hi), "spread " + pct((p.hi / p.lo - 1) * 100)) +
      stat("Latest price gap", gap == null ? "\u2013" : "+" + gap.toFixed(1) + "%", gap == null ? "only one supplier" : esc(dear.supplier) + " " + money(dear.st.latest) + " vs " + esc(cheap.supplier) + " " + money(cheap.st.latest)) + stat("Suppliers", String(gs.length), gs.map((g) => esc(g.supplier)).join(", ")) + "</div></div>" +
      '<div class="panel block" style="padding:4px 8px 8px"><div class="tbl-wrap"><table><thead><tr><th>Supplier</th><th class="n">Purchases</th><th class="n">Latest</th><th class="n">Average</th><th class="n">Low \u2013 high</th><th class="n">Std dev</th><th class="n">Variation</th><th class="n">First \u2192 latest</th><th class="n">Last purchase</th></tr></thead><tbody>' + rowsHtml + "</tbody></table></div></div>";
    return;
  }
  const sg = V.selGroups;
  if (!sg.length) { el.innerHTML = '<div class="panel sum"><div class="lbl">Tick one or more rows below to see their standard deviation and generate a chart.</div></div>'; return; }
  if (sg.length === 1) {
    const g = sg[0], s = g.st;
    el.innerHTML = '<div class="panel sum"><div class="sum-head"><h2>Selection: ' + esc(g.sku) + ", " + esc(g.supplier) + '</h2><span class="lbl">1 row selected \u00b7 ' + s.n + " purchase" + (s.n === 1 ? "" : "s") + " in range</span></div><div class=\"cards\">" +
      stat("Standard deviation", moneySd(s.sd), s.sd == null ? "needs 2 or more purchases" : "sample, across the purchases") + stat("Variation", pct(s.cv), "std dev \u00f7 average price") + stat("Average price", money(s.mean), "per unit") + stat("Low \u2013 high", money(s.lo) + " \u2013 " + money(s.hi), "spread " + pct((s.hi / s.lo - 1) * 100)) +
      stat("First \u2192 latest", signPct(s.change), money(s.first) + " \u2192 " + money(s.latest)) + stat("Last purchase", fmtDate(s.lastDate), esc(g.supplier)) + "</div></div>";
    return;
  }
  const withCv = sg.filter((g) => g.st.cv != null), top = [...withCv].sort((a, b) => b.st.cv - a.st.cv)[0], med = median(withCv.map((g) => g.st.cv));
  const changes = sg.filter((g) => g.st.change != null), big = [...changes].sort((a, b) => b.st.change - a.st.change)[0];
  const sameSku = new Set(sg.map((g) => g.sku)).size === 1, p = sameSku ? pooled(sg) : null;
  el.innerHTML = '<div class="panel sum"><div class="sum-head"><h2>Selection: ' + sg.length + ' rows</h2><span class="lbl">Ticked in the table \u00b7 ' + esc(S.from ? fmtDate(S.from) : "start") + " to " + esc(S.to ? fmtDate(S.to) : "today") + "</span></div><div class=\"cards\">" +
    stat("Rows selected", String(sg.length), "of " + V.visible.length + " shown") + (p ? stat("Standard deviation", moneySd(p.sd), "the ticked suppliers pooled") + stat("Variation", pct(p.cv), "std dev \u00f7 average price") : "") +
    stat("Most volatile", top ? pct(top.st.cv) : "\u2013", top ? esc(top.sku) + ", " + esc(top.supplier) : "needs 2 or more purchases") + stat("Median variation", pct(med), "across the selected rows") + stat("Rows at " + WATCH_PCT + "% or more", withCv.filter((g) => g.st.cv >= WATCH_PCT).length + " of " + withCv.length, "flagged Watch or High") +
    stat("Largest increase", big ? signPct(big.st.change) : "\u2013", big ? esc(big.sku) + ", " + esc(big.supplier) : "") + "</div></div>";
}

// what the chart will draw right now, or why it can't
function chartPlan() {
  if (S.view === "all") {
    if (!V.focusSku) return { err: "Choose one SKU first: pick it in the SKU picker or tick one of its rows." };
    const gs = V.focusGroups.slice(0, MAX_LINES);
    return { mode: "lines", series: gs.map((g) => ({ label: g.supplier, rows: g.rows, st: g.st, g })), title: "Price paid per unit for " + V.focusSku + ", by supplier", subtitle: "Each marker is one purchase order line. Lines join purchases in date order.", note: V.focusGroups.length > MAX_LINES ? "Showing the " + MAX_LINES + " suppliers with the most purchases." : "" };
  }
  const sg = V.selGroups;
  if (!sg.length) return { err: "Tick at least one row to chart it." };
  if (sg.length > MAX_LINES) {
    const items = sg.filter((g) => g.st.cv != null).sort((a, b) => b.st.cv - a.st.cv).slice(0, RANK_ROWS);
    if (!items.length) return { err: "None of the ticked rows has two or more purchases yet, so there is no variation to rank." };
    return { mode: "rank", items, all: sg, title: "Price volatility ranking of " + sg.length + " selected rows", subtitle: "Most volatile first. More than " + MAX_LINES + " rows ticked, so this ranks them instead of drawing lines.", note: sg.length > items.length ? "Showing the " + items.length + " most volatile." : "" };
  }
  const sameSku = new Set(sg.map((g) => g.sku)).size === 1, sameSup = new Set(sg.map((g) => g.supplier)).size === 1;
  return { mode: "lines", series: sg.map((g) => ({ label: sameSku ? g.supplier : sameSup ? g.sku : g.sku + " \u00b7 " + g.supplier, rows: g.rows, st: g.st, g })), title: "Price paid per unit over time", subtitle: "Each marker is one purchase order line. Lines join purchases in date order.", note: "" };
}

function renderChart() {
  const el = $("chart"), btn = $("gen");
  const plan = S.loaded && S.rows.length ? chartPlan() : { err: "" };
  $("gen-hint").textContent = S.view === "all" ? (V && V.focusSku ? "Comparing every supplier for " + V.focusSku + "." : "Choose one SKU to compare suppliers.") : (V && V.selGroups.length > MAX_LINES ? "More than " + MAX_LINES + " ticked: the chart ranks volatility." : "Tick up to " + MAX_LINES + " rows, then generate a chart.");
  btn.disabled = !!plan.err && !S.chartOn;      // an open chart can always be hidden
  $("gen-text").textContent = S.chartOn ? "Hide chart" : "Generate chart";
  if (!S.chartOn) { el.innerHTML = ""; return; }
  if (plan.err) { el.innerHTML = '<div class="panel chart-panel"><div class="lbl">' + esc(plan.err) + "</div></div>"; return; }
  const svg = plan.mode === "lines" ? lineChartSvg(plan.series, plan.title) : rankingSvg(plan.items, plan.title);
  el.innerHTML = '<div class="panel chart-panel"><div class="chart-head"><h2>' + esc(plan.title) + '</h2><span class="lbl">' + esc(plan.subtitle) + (plan.note ? " " + esc(plan.note) : "") + '</span></div><div class="chart-box" id="chart-box">' + svg + '</div><div class="chart-actions"><button type="button" class="btn quiet" id="dl-img">Download chart image</button><button type="button" class="btn quiet" id="dl-csv">Download data (CSV)</button></div></div>';
  $("dl-img").onclick = () => downloadPng($("chart-box").querySelector("svg"), "supplier-pricing-chart");
  $("dl-csv").onclick = () => downloadCsv(plan);
}

const COLS = [["sku", "SKU"], ["supplier", "Supplier"], ["n", "Purchases"], ["latest", "Latest"], ["mean", "Average"], ["hi", "Low \u2013 high"], ["sd", "Std dev"], ["cv", "Variation"], ["change", "First \u2192 latest"]];
function spark(g, col) {
  const p = g.rows.map((r) => r.unit_price), lo = Math.min(...p), hi = Math.max(...p), span = hi - lo || 1;
  const pts = p.map((v, i) => (2 + 68 * i / Math.max(1, p.length - 1)).toFixed(1) + "," + (20 - 16 * (v - lo) / span).toFixed(1)).join(" ");
  return '<svg width="72" height="24" viewBox="0 0 72 24" role="img" aria-label="Price trend for ' + esc(g.sku) + ", " + esc(g.supplier) + '">' + (p.length > 1 ? '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round"/>' : '<circle cx="36" cy="12" r="3" fill="' + col + '"/>') + "</svg>";
}
function renderTable() {
  const shown = V.visible.slice(0, S.shown);
  const allTicked = shown.length > 0 && shown.every((g) => S.selected.has(g.key));
  $("thead").innerHTML = "<tr><th><input type=\"checkbox\" id=\"tick-all\" aria-label=\"Tick all rows shown\"" + (allTicked ? " checked" : "") + "></th>" + COLS.map(([k, label]) => {
    const on = S.sort.key === k, num = !["sku", "supplier"].includes(k);
    return '<th scope="col" class="' + (num ? "n" : "") + '"' + (on ? ' aria-sort="' + (S.sort.dir > 0 ? "ascending" : "descending") + '"' : "") + '><button type="button" data-sort="' + k + '">' + esc(label) + (on ? (S.sort.dir > 0 ? " \u25b2" : " \u25bc") : "") + "</button></th>";
  }).join("") + "<th scope=\"col\">Trend</th></tr>";
  $("tbody").innerHTML = shown.map((g, i) => {
    const s = g.st, sel = S.selected.has(g.key), col = s.cv != null && s.cv >= HIGH_PCT ? "#C1594A" : s.cv != null && s.cv >= WATCH_PCT ? "#D9A441" : "#4FB0A5";
    return '<tr' + (sel ? ' class="sel"' : "") + '><td><input type="checkbox" data-i="' + i + '"' + (sel ? " checked" : "") + ' aria-label="Select ' + esc(g.sku) + ", " + esc(g.supplier) + '"></td><td><div class="sku">' + esc(g.sku) + '</div><div class="desc">' + esc(g.desc) + "</div></td><td>" + esc(g.supplier) + '</td><td class="n">' + s.n + '</td><td class="n">' + money(s.latest) + '</td><td class="n">' + money(s.mean) + '</td><td class="n">' + money(s.lo) + " \u2013 " + money(s.hi) + '</td><td class="n">' + moneySd(s.sd) + '</td><td class="n">' + cvCell(s.cv) + '</td><td class="n">' + signPct(s.change) + "</td><td>" + spark(g, col) + "</td></tr>";
  }).join("") || '<tr><td colspan="11" class="lbl" style="padding:20px 10px">' + (S.rows.length ? "No rows match these filters." : "") + "</td></tr>";
  $("count").textContent = V.visible.length ? "Showing 1\u2013" + shown.length + " of " + V.visible.length + " SKU and supplier pairs (" + V.base.length + " purchase lines in range)." : "";
  $("more").classList.toggle("hidden", V.visible.length <= S.shown);
  $("clear-sel").classList.toggle("hidden", !S.selected.size);
  $("table-panel").classList.toggle("hidden", !S.loaded || !S.rows.length);
}

// Every change redraws the table, which would drop keyboard focus; put it back on the same control.
function focusSelector() {
  const a = document.activeElement;
  if (!a || !a.closest || !a.closest("#thead, #tbody")) return null;
  if (a.id) return "#" + a.id;
  if (a.dataset && a.dataset.sort) return '#thead [data-sort="' + a.dataset.sort + '"]';
  if (a.dataset && a.dataset.i != null) return '#tbody [data-i="' + a.dataset.i + '"]';
  return null;
}
function update() {
  if (!S.loaded) return;
  const keep = focusSelector();
  refreshDependents();
  derive(); renderSummary(); renderChart(); renderTable();
  if (keep) { const n = document.querySelector(keep); if (n) n.focus(); }
  $("dest-text").textContent = destLabel();
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === S.view ? "true" : "false"));
}

// ---------------------------------------------------------------- downloads
function saveBlob(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
const csvCell = (v) => { let s = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function downloadCsv(plan) {
  const lines = [];
  if (plan.mode === "lines") {
    lines.push(["SKU", "Description", "Supplier", "Destination", "PO", "Order date", "Unit price", "Quantity ordered", "Quantity received"]);
    for (const s of plan.series) for (const r of s.rows) lines.push([r.product_id, r.description || "", r.supplier, r.destination === NONE ? "" : r.destination, r.po_id, r.order_date, r.unit_price, r.quantity, r.quantity_received]);
  } else {
    lines.push(["SKU", "Description", "Supplier", "Purchases", "Latest", "Average", "Low", "High", "Std dev", "Variation %", "First to latest %"]);
    for (const g of plan.all) lines.push([g.sku, g.desc, g.supplier, g.st.n, g.st.latest, g.st.mean, g.st.lo, g.st.hi, g.st.sd, g.st.cv, g.st.change]);
  }
  saveBlob(new Blob(["\ufeff" + lines.map((l) => l.map(csvCell).join(",")).join("\r\n")], { type: "text/csv;charset=utf-8" }), "supplier-pricing-" + todayIso() + ".csv");
}
function downloadPng(svgEl, name) {
  const vb = svgEl.viewBox.baseVal, scale = 2, xml = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => { const c = document.createElement("canvas"); c.width = vb.width * scale; c.height = vb.height * scale; const x = c.getContext("2d"); x.fillStyle = "#22272C"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); c.toBlob((b) => saveBlob(b, name + "-" + todayIso() + ".png"), "image/png"); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
}

// ---------------------------------------------------------------- events
let qTimer = null;
$("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value; S.shown = PAGE; update(); }, 150); });
$("sup").addEventListener("change", (e) => { S.supplier = e.target.value; S.shown = PAGE; update(); });
function setSkuOpen(open) {
  $("sku-pop").classList.toggle("hidden", !open);
  $("skubtn").setAttribute("aria-expanded", open ? "true" : "false");
  if (open) { setDestOpen(false); renderSkuOpts(); $("sku-q").focus(); }
}
$("skubtn").addEventListener("click", () => setSkuOpen($("sku-pop").classList.contains("hidden")));
$("sku-q").addEventListener("input", (e) => { S.skuQuery = e.target.value; renderSkuOpts(); });
$("sku-opts").addEventListener("change", (e) => { const x = SKU_VIEW[Number(e.target.dataset.s)]; if (x == null) return; if (e.target.checked) S.skus.add(x); else S.skus.delete(x); S.shown = PAGE; update(); });
$("sku-all").addEventListener("click", () => { skuMatches().forEach((x) => S.skus.add(x)); renderSkuOpts(); S.shown = PAGE; update(); });
$("sku-clear").addEventListener("click", () => { S.skus = new Set(); renderSkuOpts(); S.shown = PAGE; update(); });
$("sku-done").addEventListener("click", () => { setSkuOpen(false); $("skubtn").focus(); });
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "chips-clear") S.skus = new Set(); else if (b.dataset.rm != null) S.skus.delete(CHIP_VIEW[Number(b.dataset.rm)]); else return;
  renderSkuOpts(); S.shown = PAGE; update(); $("skubtn").focus();
});
$("presets").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.p === "custom") { S.preset = "custom"; document.querySelectorAll("#presets button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.p === "custom" ? "true" : "false")); } else applyPreset(b.dataset.p); S.shown = PAGE; update(); });
const onDates = () => { S.from = $("from").value; S.to = $("to").value; S.preset = "custom"; document.querySelectorAll("#presets button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.p === "custom" ? "true" : "false")); S.shown = PAGE; update(); };
$("from").addEventListener("change", onDates); $("to").addEventListener("change", onDates);
$("views").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S.view = b.dataset.v; update(); });
$("gen").addEventListener("click", () => { S.chartOn = !S.chartOn; update(); if (S.chartOn) { const el = $("chart"); if (el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "nearest" }); } });
$("dest").addEventListener("click", () => { const open = $("dest-pop").classList.contains("hidden"); if (open) setSkuOpen(false); setDestOpen(open); });
$("dest-pop").addEventListener("change", (e) => {
  if (e.target.id === "dest-all") S.availDests.forEach((d) => (e.target.checked ? S.dests.add(d) : S.dests.delete(d)));
  else if (e.target.dataset.d != null) { const d = S.availDests[Number(e.target.dataset.d)]; if (e.target.checked) S.dests.add(d); else S.dests.delete(d); }
  renderDestPop(); S.shown = PAGE; update();
});
$("dest-pop").addEventListener("click", (e) => { if (e.target.id === "dest-clear") { S.availDests.forEach((d) => S.dests.delete(d)); renderDestPop(); update(); } if (e.target.id === "dest-done") { setDestOpen(false); $("dest").focus(); } });
// composedPath, not e.target: a button inside the picker may have been re-drawn (and detached) by its own handler
document.addEventListener("click", (e) => { const path = e.composedPath(); if (!path.includes($("dest-wrap"))) setDestOpen(false); if (!path.includes($("sku-wrap"))) setSkuOpen(false); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("dest-pop").classList.contains("hidden")) { setDestOpen(false); $("dest").focus(); }
  if (!$("sku-pop").classList.contains("hidden")) { setSkuOpen(false); $("skubtn").focus(); }
});
$("thead").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-sort]");
  if (b) { const k = b.dataset.sort; S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: ["sku", "supplier"].includes(k) ? 1 : -1 }; update(); return; }
  if (e.target.id === "tick-all") { const shown = V.visible.slice(0, S.shown); if (e.target.checked) shown.forEach((g) => S.selected.add(g.key)); else shown.forEach((g) => S.selected.delete(g.key)); update(); }
});
$("tbody").addEventListener("change", (e) => { const i = e.target.dataset.i; if (i == null) return; const g = V.visible.slice(0, S.shown)[Number(i)]; if (!g) return; if (e.target.checked) S.selected.add(g.key); else S.selected.delete(g.key); update(); });
$("more").addEventListener("click", () => { S.shown += PAGE; update(); });
$("clear-sel").addEventListener("click", () => { S.selected = new Set(); update(); });

applyPreset(S.preset);
load();
</script>
</body>
</html>
