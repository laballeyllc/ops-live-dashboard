<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Alley — Live Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #1B1F23;
    --panel: #22272C;
    --panel-raised: #282E34;
    --border: #2E343A;
    --text: #E8E6E1;
    --text-muted: #9AA0A6;
    --warehouse: #4FB0A5;
    --warehouse-dim: #2E4A47;
    --freight: #D9A441;
    --freight-dim: #4A3F26;
    --alert: #C1594A;
    --both: #8B7FC7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header h1 span {
    color: var(--text-muted);
    font-weight: 400;
  }

  #last-updated {
    font-size: 13px;
    color: var(--text-muted);
  }

  #last-updated .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--warehouse);
    margin-right: 7px;
    animation: pulse 2s ease-in-out infinite;
  }

  #last-updated .dot.stale { background: var(--alert); animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  main {
    padding: 28px 32px 48px;
    max-width: 1400px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 28px;
  }

  .summary-card {
    background: var(--panel);
    padding: 18px 20px;
  }

  .summary-card .value {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.1;
  }

  .summary-card .label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .summary-card.warehouse .value { color: var(--warehouse); }
  .summary-card.freight .value { color: var(--freight); }
  .summary-card.both .value { color: var(--both); }
  .summary-card.alert .value { color: var(--alert); }

  .breakdowns {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }

  .breakdown-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
  }

  .breakdown-panel h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 12px;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .bar-row .bar-label {
    width: 130px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .bar-row .bar-track {
    flex: 1;
    height: 8px;
    background: var(--panel-raised);
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-row .bar-fill {
    height: 100%;
    background: var(--warehouse);
    border-radius: 4px;
  }

  .bar-row .bar-count {
    width: 34px;
    text-align: right;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
  }

  thead th {
    text-align: left;
    padding: 10px 14px;
    background: var(--panel-raised);
    color: var(--text-muted);
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }

  thead th:hover { color: var(--text); }

  thead th.sorted::after {
    content: ' ▾';
    color: var(--warehouse);
  }

  thead th.sorted.asc::after {
    content: ' ▴';
  }

  tbody td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--panel-raised); }

  td.description {
    white-space: normal;
    max-width: 320px;
  }

  .tag-pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
  }

  .tag-pill.warehouse { background: var(--warehouse-dim); color: var(--warehouse); }
  .tag-pill.freight { background: var(--freight-dim); color: var(--freight); }
  .tag-pill.both { background: #35306B; color: var(--both); }
  .tag-pill.other { background: var(--panel-raised); color: var(--text-muted); }

  #empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <h1>Lab Alley <span>· Live Queue</span></h1>
  <div id="last-updated"><span class="dot" id="last-updated-dot"></span><span id="last-updated-text">Loading…</span></div>
</header>

<main>
  <div class="summary-row" id="summary-row"></div>

  <div class="breakdowns">
    <div class="breakdown-panel">
      <h2>Category</h2>
      <div id="category-breakdown"></div>
    </div>
    <div class="breakdown-panel">
      <h2>CHEM TECH</h2>
      <div id="chemtech-breakdown"></div>
    </div>
    <div class="breakdown-panel">
      <h2>LAB ROOM required</h2>
      <div id="labroom-breakdown"></div>
    </div>
  </div>

  <table id="queue-table">
    <thead>
      <tr>
        <th data-key="order_id">Order ID</th>
        <th data-key="order_date">Order date</th>
        <th data-key="product_id">Product ID</th>
        <th data-key="description">Description</th>
        <th data-key="category">Category</th>
        <th data-key="chem_tech">CHEM TECH</th>
        <th data-key="lab_room">LAB ROOM</th>
        <th data-key="core_queue">Queue</th>
      </tr>
    </thead>
    <tbody id="queue-tbody"></tbody>
  </table>
  <div id="empty-state" style="display:none;">No live queue data found yet — check that the "Live Queue Pull" GitHub Action has run at least once.</div>
</main>

<script>
// --- Fill these in from Supabase: Project Settings -> API -----------
// SUPABASE_ANON_KEY is the public, READ-ONLY key (safe to ship in a
// static site — Row Level Security on the live_queue/snapshots tables
// only grants it SELECT, nothing else). Never put the service_role key
// here; that one belongs only in GitHub Actions Secrets.
const SUPABASE_URL = "https://pdflsmequzgpeuodnxyg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkZmxzbWVxdXpncGV1b2RueHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MTAxODMsImV4cCI6MjEwNTA4NjE4M30.F-h_K_cQ4v8UN5JFZBD8AEgqdujmD2zWFPalsAiE45w";
// ----------------------------------------------------------------------

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentRows = [];
let sortKey = "order_date";
let sortAsc = true;

function tagPillClass(coreQueue) {
  if (coreQueue === "Warehouse") return "warehouse";
  if (coreQueue === "Freight") return "freight";
  if (coreQueue === "Both") return "both";
  return "other";
}

function orderAgeDays(orderDateStr) {
  if (!orderDateStr) return null;
  const orderDate = new Date(orderDateStr.slice(0, 10) + "T00:00:00Z");
  if (isNaN(orderDate)) return null;
  const today = new Date();
  const todayUTC = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()));
  return Math.floor((todayUTC - orderDate) / 86400000);
}

function buildSummary(rows) {
  // Dedupe to one entry per order (core_queue/order_date are the same
  // across every product line of a given order) before counting "how
  // many orders" — but category-type breakdowns stay at the line level,
  // since a single order can span more than one category.
  const orders = new Map();
  for (const row of rows) {
    if (!orders.has(row.order_id)) orders.set(row.order_id, row);
  }

  const coreQueueCounts = {};
  let oldestAge = 0;
  let oldestOrderId = null;
  for (const [oid, row] of orders) {
    const cq = row.core_queue || "Other";
    coreQueueCounts[cq] = (coreQueueCounts[cq] || 0) + 1;
    const age = orderAgeDays(row.order_date);
    if (age !== null && age > oldestAge) {
      oldestAge = age;
      oldestOrderId = oid;
    }
  }

  function lineCounts(field) {
    const counts = {};
    for (const row of rows) {
      const value = (row[field] || "").trim() || "(none)";
      counts[value] = (counts[value] || 0) + 1;
    }
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  return {
    total_orders: orders.size,
    core_queue_counts: coreQueueCounts,
    oldest_age_days: oldestAge,
    oldest_order_id: oldestOrderId,
    category_counts: lineCounts("category"),
    chem_tech_counts: lineCounts("chem_tech"),
    lab_room_counts: lineCounts("lab_room"),
  };
}

function renderSummary(summary) {
  const cq = summary.core_queue_counts || {};
  const cards = [
    { label: "In queue", value: summary.total_orders, cls: "" },
    { label: "Warehouse", value: cq["Warehouse"] || 0, cls: "warehouse" },
    { label: "Freight", value: cq["Freight"] || 0, cls: "freight" },
    { label: "Split (both)", value: cq["Both"] || 0, cls: "both" },
    {
      label: summary.oldest_order_id ? `Oldest — #${summary.oldest_order_id}` : "Oldest order",
      value: summary.oldest_age_days + "d",
      cls: summary.oldest_age_days > 14 ? "alert" : ""
    },
  ];
  document.getElementById("summary-row").innerHTML = cards.map(c => `
    <div class="summary-card ${c.cls}">
      <div class="value">${c.value}</div>
      <div class="label">${c.label}</div>
    </div>
  `).join("");
}

function renderBreakdown(elId, counts) {
  const total = counts.reduce((sum, [, n]) => sum + n, 0) || 1;
  const top = counts.slice(0, 6);
  document.getElementById(elId).innerHTML = top.map(([label, n]) => `
    <div class="bar-row">
      <div class="bar-label" title="${label}">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(n/total*100).toFixed(0)}%"></div></div>
      <div class="bar-count">${n}</div>
    </div>
  `).join("");
}

function renderTable() {
  const rows = [...currentRows].sort((a, b) => {
    const av = (a[sortKey] ?? "").toString();
    const bv = (b[sortKey] ?? "").toString();
    const cmp = av.localeCompare(bv, undefined, { numeric: true });
    return sortAsc ? cmp : -cmp;
  });

  document.getElementById("queue-tbody").innerHTML = rows.map(r => `
    <tr>
      <td>${r.order_id || ""}</td>
      <td>${r.order_date || ""}</td>
      <td>${r.product_id || ""}</td>
      <td class="description">${r.description || ""}</td>
      <td>${r.category || ""}</td>
      <td>${r.chem_tech || ""}</td>
      <td>${r.lab_room || ""}</td>
      <td><span class="tag-pill ${tagPillClass(r.core_queue)}">${r.core_queue || "Other"}</span></td>
    </tr>
  `).join("");

  document.querySelectorAll("thead th").forEach(th => {
    th.classList.toggle("sorted", th.dataset.key === sortKey);
    th.classList.toggle("asc", th.dataset.key === sortKey && sortAsc);
  });
}

document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    if (sortKey === th.dataset.key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = th.dataset.key;
      sortAsc = true;
    }
    renderTable();
  });
});

function formatLastUpdated(pulledAtIso) {
  // Data is stored in UTC (correctly, deliberately) — convert to Central
  // time for display, since nobody should have to do that math in their
  // head. Intl's timeZone option handles the Daylight/Standard Time
  // switch automatically, unlike a fixed UTC offset would.
  const d = new Date(pulledAtIso);
  return d.toLocaleString("en-US", {
    timeZone: "America/Chicago",
    hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true,
  }) + " CT";
}

async function refresh() {
  try {
    const { data, error } = await client.from("live_queue").select("*");
    if (error) throw error;

    currentRows = data || [];
    const dot = document.getElementById("last-updated-dot");

    if (currentRows.length) {
      const mostRecent = currentRows.reduce((max, r) => r.pulled_at > max ? r.pulled_at : max, currentRows[0].pulled_at);
      document.getElementById("last-updated-text").textContent = `Updated ${formatLastUpdated(mostRecent)}`;
      dot.classList.remove("stale");
    } else {
      document.getElementById("last-updated-text").textContent = "No data yet";
      dot.classList.add("stale");
    }

    document.getElementById("empty-state").style.display = currentRows.length ? "none" : "block";
    document.getElementById("queue-table").style.display = currentRows.length ? "table" : "none";

    const summary = buildSummary(currentRows);
    renderSummary(summary);
    renderBreakdown("category-breakdown", summary.category_counts);
    renderBreakdown("chemtech-breakdown", summary.chem_tech_counts);
    renderBreakdown("labroom-breakdown", summary.lab_room_counts);
    renderTable();
  } catch (err) {
    console.error(err);
    document.getElementById("last-updated-text").textContent = "Connection error — check console";
    document.getElementById("last-updated-dot").classList.add("stale");
  }
}

refresh();
setInterval(refresh, 30000);
</script>

</body>
</html>
