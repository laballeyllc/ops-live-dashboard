<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A3A;
    --paper: #ECE7DA;
    --paper-dark: #DFD8C6;
    --stamp: #D97E1E;
    --good: #3F6B4A;
    --alert: #AB4438;
    --card-bg: #FBF9F3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-dark) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-dark) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header.masthead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.18em;
    font-size: 12px;
    color: var(--stamp);
    font-weight: 700;
    text-transform: uppercase;
  }
  h1 { margin: 4px 0 0; font-size: 28px; font-weight: 700; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--good);
    display: inline-block;
  }
  .dot.off { background: var(--alert); }
  .dot.loading { background: var(--stamp); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  #lastUpdated { margin: 4px 0 28px; font-family: 'Space Mono', monospace; font-size: 12px; opacity: 0.6; }

  .refresh-btn {
    background: var(--ink); color: var(--paper); border: none;
    padding: 6px 14px; border-radius: 4px; font-family: 'Space Mono', monospace;
    font-size: 12px; cursor: pointer;
  }
  .refresh-btn:hover { background: var(--stamp); }

  .error-box {
    background: #F7E7E4; border: 2px dashed var(--alert); border-radius: 6px;
    padding: 18px 20px; margin-bottom: 24px; font-size: 14px; line-height: 1.6; display: none;
  }
  .error-box code {
    background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 3px;
    font-family: 'Space Mono', monospace; font-size: 12.5px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }
  .stat-card {
    position: relative;
    background: var(--card-bg);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 16px 14px 22px;
    overflow: hidden;
  }
  .stat-card::before {
    content: "";
    position: absolute;
    left: -8px; right: -8px; top: -8px;
    height: 16px;
    background-image: radial-gradient(circle 8px, var(--paper) 8px, transparent 8px);
    background-size: 20px 20px;
    background-position: -2px -8px;
  }
  .stat-label {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 8px;
  }
  .stat-value { font-family: 'Space Mono', monospace; font-size: 30px; font-weight: 700; line-height: 1; }
  .barcode {
    position: absolute; bottom: 0; left: 0; right: 0; height: 8px;
    background-image: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 11px);
    opacity: 0.55;
  }
  .queue-group-label {
    font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; opacity: 0.55; margin: 24px 0 10px;
  }
  footer { text-align: center; font-family: 'Space Mono', monospace; font-size: 11px; opacity: 0.45; margin-top: 40px; }
  footer a { color: var(--stamp); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="eyebrow">Operations · Live</div>
      <h1>Right Now</h1>
    </div>
    <div class="status-row">
      <span class="dot loading" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
  </header>
  <div id="lastUpdated">—</div>

  <div class="error-box" id="errorBox"></div>

  <div class="queue-group-label">Awaiting Shipment Queue</div>
  <div class="stat-grid" id="queueGrid"></div>

  <div class="queue-group-label">Today So Far</div>
  <div class="stat-grid" id="todayGrid"></div>

  <footer>Polling <code id="serverUrlLabel"></code> every 20 seconds · run <code>python live_server.py</code> on this machine to enable</footer>
</div>

<script>
const SERVER_URL = "http://localhost:5055/api/live";
document.getElementById('serverUrlLabel').textContent = SERVER_URL;

const fmt = n => (n === null || n === undefined) ? '—' : (Number.isInteger(n) ? n.toLocaleString() : n);

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'dot ' + state;
  document.getElementById('statusText').textContent = text;
}

function renderQueue(data) {
  const grid = document.getElementById('queueGrid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-label">Warehouse</div><div class="stat-value">${fmt(data.warehouse_queue)}</div><div class="barcode"></div></div>
    <div class="stat-card"><div class="stat-label">Freight</div><div class="stat-value">${fmt(data.freight_queue)}</div><div class="barcode"></div></div>
  `;
  const todayGrid = document.getElementById('todayGrid');
  todayGrid.innerHTML = `
    <div class="stat-card"><div class="stat-label">Orders In</div><div class="stat-value">${fmt(data.orders_in)}</div><div class="barcode"></div></div>
    <div class="stat-card"><div class="stat-label">Orders Out</div><div class="stat-value">${fmt(data.orders_out)}</div><div class="barcode"></div></div>
    <div class="stat-card"><div class="stat-label">Packages Shipped</div><div class="stat-value">${fmt(data.packages_shipped)}</div><div class="barcode"></div></div>
    <div class="stat-card"><div class="stat-label">Avg Pkgs / Order</div><div class="stat-value">${fmt(data.avg_packages_per_order)}</div><div class="barcode"></div></div>
  `;
}

async function refresh() {
  setStatus('loading', 'Refreshing…');
  document.getElementById('errorBox').style.display = 'none';
  try {
    const res = await fetch(SERVER_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Server responded with ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    renderQueue(data);
    const t = new Date(data.timestamp);
    document.getElementById('lastUpdated').textContent = 'Last updated ' + t.toLocaleTimeString();
    setStatus('', 'Connected');
  } catch (err) {
    setStatus('off', 'Not connected');
    const box = document.getElementById('errorBox');
    box.style.display = 'block';
    box.innerHTML = `Could not reach the live server at <code>${SERVER_URL}</code>.<br><br>
      Make sure it's running: open a terminal in this project folder and run <code>python live_server.py</code>, then click Refresh.<br><br>
      <span style="opacity:0.7">Details: ${err.message}</span>`;
  }
}

document.getElementById('refreshBtn').onclick = refresh;
refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
