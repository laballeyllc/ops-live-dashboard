# This repo holds both the backend automation (Python scripts + GitHub
# Actions workflows) and the frontend dashboard. Netlify only needs the
# frontend — this tells it where to find it, and runs netlify-build.sh
# on every deploy to inject the real Supabase key from Netlify's own
# environment variables (SUPABASE_ANON_KEY) into site/index.html,
# replacing the placeholder that's committed to the repo. This file
# takes precedence over whatever build command is set in Netlify's UI —
# confirmed directly (2026-09-24): the UI showed the right command, but
# builds kept running with none at all, because this file explicitly
# set command = "" and silently overrode it every time.

[build]
  publish = "site"
  command = "bash netlify-build.sh"
